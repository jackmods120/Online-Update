<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونەژوورەوە | جاک ئەپدەیت</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .panel { background: #1C1C1E; padding: 24px; border-radius: 14px; width: 100%; max-width: 400px; }
    h2 { color: #fff; text-align: center; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #2C2C2E; border: none; border-radius: 8px; color: #fff; }
    button { width: 100%; padding: 14px; background: #0A84FF; color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .toggle { text-align: center; margin-top: 16px; color: #8E8E93; }
    .toggle a { color: #0A84FF; cursor: pointer; }
    .status { text-align: center; margin-top: 8px; }
  </style>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 📌 ڕێکخستنی نوێکراوی Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyC0_fw0HIADvNIiDQyy6lsY7XsIABk0se8",
      authDomain: "dialog-jack.firebaseapp.com",
      databaseURL: "https://dialog-jack-default-rtdb.firebaseio.com",
      projectId: "dialog-jack",
      storageBucket: "dialog-jack.firebasestorage.app",
      messagingSenderId: "127556343331",
      appId: "1:127556343331:web:308985974ac23e52924396",
      measurementId: "G-N8TQGS80TY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '/dashboard.html';
      }
    });

    window.toggleForm = function() {
      document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('status').textContent = '';
    };

    window.login = function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('status');
      signInWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = '/dashboard.html')
        .catch(error => status.textContent = '❌ ' + error.message);
    };

    window.signup = function() {
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const status = document.getElementById('status');
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = '/dashboard.html')
        .catch(error => status.textContent = '❌ ' + error.message);
    };
  </script>
</head>
<body>
  <div class="panel">
    <h2>🔐 جاک ئەپدەیت</h2>
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="ئیمەیڵ" required>
      <input type="password" id="loginPassword" placeholder="ووشەی نهێنی" required>
      <button onclick="login()">چوونەژوورەوە</button>
      <div class="toggle">هەژمارت نییە؟ <a onclick="toggleForm()">دروستکردنی هەژمار</a></div>
    </div>
    <div id="signupForm" style="display: none;">
      <input type="email" id="signupEmail" placeholder="ئیمەیڵ" required>
      <input type="password" id="signupPassword" placeholder="ووشەی نهێنی (لانیکەم ٦ پیت)" required>
      <button onclick="signup()">دروستکردنی هەژمار</button>
      <div class="toggle">هەژمارت هەیە؟ <a onclick="toggleForm()">چوونەژوورەوە</a></div>
    </div>
    <div id="status" class="status" style="color: #FF3B30;"></div>
  </div>
</body>
</html>
