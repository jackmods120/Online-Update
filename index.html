<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاک ئەپدەیت | پانێڵی گشتی</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .panel {
      background: #1C1C1E;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { color: #fff; text-align: center; margin-bottom: 8px; }
    .subtitle { color: #8E8E93; text-align: center; font-size: 13px; margin-bottom: 24px; }
    label { color: #8E8E93; font-size: 14px; display: block; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      background: #2C2C2E;
      border: 1px solid #3A3A3C;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus { border-color: #0A84FF; outline: none; }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      background: #0A84FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    button:hover { background: #007AFF; }
    .status { text-align: center; margin-top: 16px; color: #8E8E93; }
    .note { background: #2C2C2E; padding: 12px; border-radius: 8px; margin-bottom: 20px; color: #FFD60A; font-size: 13px; }
    hr { border: 0.5px solid #3A3A3C; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>⚡ جاک ئەپدەیت مەیکەر</h2>
    <div class="subtitle">بۆ بەکارهێنەرانی پەچی JackUpdateDialog</div>
    
    <div class="note">
      ⚠️ زانیارییەکانی خوارەوە تایبەتن بە پڕۆژەی Firebaseـی تۆ. 
      لە کۆنسۆڵی Firebase > Realtime Database دەیدۆزیتەوە.
    </div>

    <!-- بەشی ناسنامەی بنکەدراوە -->
    <label>🔗 لینکی بنکەدراوە (Database URL)</label>
    <input type="url" id="dbUrl" placeholder="https://YOUR-PROJECT-default-rtdb.firebaseio.com" required>
    
    <label>🔐 نهێنی بنکەدراوە (Database Secret)</label>
    <input type="password" id="dbSecret" placeholder="وشەی نهێنی درێژ..." required>

    <hr>

    <!-- بەشی ڕێکخستنەکانی نوێکردنەوە -->
    <label>📱 ناونیشان</label>
    <input type="text" id="title" placeholder="📢 Update Available" value="📢 وەشانی نوێ بەردەستە">
    
    <label>📝 پەیام</label>
    <textarea id="message" placeholder="تکایە ئەپەکەت نوێ بکەرەوە...">وەشانی نوێ بەردەستە. تکایە ئەپەکەت نوێ بکەرەوە.</textarea>
    
    <label>🔗 لینکی دابەزاندن</label>
    <input type="url" id="updateUrl" placeholder="https://example.com/app.apk" value="https://t.me/">
    
    <label>📌 دوایین وەشان (ژمارە)</label>
    <input type="text" id="latestVersion" placeholder="1.0.1" value="1.0.1">
    
    <label>🔘 دەقی دوگمە</label>
    <input type="text" id="updateButtonText" value="نوێکردنەوە">

    <button type="submit" id="submitBtn">🚀 ناردنی نوێکردنەوە</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    submitBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      
      // وەرگرتنی زانیارییەکانی بەکارهێنەر
      const dbUrl = document.getElementById('dbUrl').value.trim();
      const dbSecret = document.getElementById('dbSecret').value.trim();
      
      if (!dbUrl || !dbSecret) {
        statusDiv.textContent = '❌ تکایە لینکی بنکەدراوە و نهێنییەکە بنووسە.';
        statusDiv.style.color = '#FF3B30';
        return;
      }

      // پاککردنەوەی لینکەکە (لابردنی / لە کۆتایی ئەگەر هەبوو)
      const cleanDbUrl = dbUrl.replace(/\/$/, '');
      
      statusDiv.textContent = '⏳ چاوەڕێ بکە...';
      statusDiv.style.color = '#8E8E93';
      
      // کۆکردنەوەی داتا لە فۆرمەکەوە
      const data = {
        title: document.getElementById('title').value,
        message: document.getElementById('message').value,
        update_url: document.getElementById('updateUrl').value,
        latest_version: document.getElementById('latestVersion').value,
        update_button_text: document.getElementById('updateButtonText').value,
        cancel_button_text: "Cancel",
        force_update: false
      };

      // دروستکردنی لینکی تەواو بە نهێنییەکەوە
      const fullUrl = `${cleanDbUrl}/update_config.json?auth=${dbSecret}`;

      try {
        const response = await fetch(fullUrl, {
          method: 'PUT',
          body: JSON.stringify(data),
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
          statusDiv.textContent = '✅ بە سەرکەوتوویی پاشەکەوت کرا!';
          statusDiv.style.color = '#34C759';
        } else {
          const errorText = await response.text();
          statusDiv.textContent = `❌ هەڵەیەک ڕوویدا (${response.status}): ${errorText}`;
          statusDiv.style.color = '#FF3B30';
        }
      } catch (error) {
        statusDiv.textContent = '❌ هەڵەی تۆڕ یان پەیوەندی: ' + error.message;
        statusDiv.style.color = '#FF3B30';
      }
    });
  </script>
</body>
</html>
