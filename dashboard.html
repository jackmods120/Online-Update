<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاک ئەپدەیت | دروستکەری لینکی Raw</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .panel { background: #1C1C1E; padding: 24px; border-radius: 14px; width: 100%; max-width: 500px; }
    h2, h3 { color: #fff; }
    label { color: #8E8E93; font-size: 14px; display: block; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 16px; background: #2C2C2E; border: none; border-radius: 8px; color: #fff; }
    button { width: 100%; padding: 14px; background: #0A84FF; color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .status { text-align: center; margin-top: 16px; }
    .raw-link { background: #2C2C2E; padding: 12px; border-radius: 8px; color: #0A84FF; word-break: break-all; margin-top: 16px; }
    hr { border-color: #3A3A3C; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>🔗 دروستکەری لینکی نوێکردنەوە</h2>
    <p style="color: #8E8E93; text-align: center;">فۆڕمەکە پڕ بکەرەوە بۆ وەرگرتنی لینکی Raw</p>

    <!-- بەشی ناسنامە -->
    <label>🆔 ناسنامەی تایبەت (ID)</label>
    <input type="text" id="updateId" placeholder="JACK_MOD" value="JACK_MOD" required>
    
    <!-- بەشی ڕێکخستنەکان -->
    <label>📱 ناونیشان</label>
    <input type="text" id="title" value="📢 وەشانی نوێ بەردەستە">
    <label>📝 پەیام</label>
    <textarea id="message">وەشانی نوێ بەردەستە. تکایە ئەپەکەت نوێ بکەرەوە.</textarea>
    <label>🔗 لینکی دابەزاندن</label>
    <input type="url" id="updateUrl" value="https://t.me/j4ck_721">
    <label>📌 دوایین وەشان</label>
    <input type="text" id="latestVersion" value="9.1.20">
    <label>🔘 دەقی دوگمە</label>
    <input type="text" id="updateButtonText" value="نوێکردنەوە">

    <button onclick="generateRawLink()">🚀 دروستکردنی لینکی Raw</button>
    
    <div id="result" style="display: none;">
      <hr>
      <h3>✅ لینکی Raw دروست بوو</h3>
      <div class="raw-link" id="rawLinkDisplay"></div>
      <button onclick="copyRawLink()">📋 کۆپیکردنی لینک</button>
      <p style="color: #8E8E93; font-size: 13px; margin-top: 8px;">ئەم لینکە لە JackUpdateDialog.java دایبنێ</p>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    // 📌 ئەم نهێنییە تایبەتە بە خۆت و لە Vercel Environment Variable دادەنرێت
    const ADMIN_SECRET = 'YOUR_SECRET_PASSWORD'; // دەبێت هەمان ئەو نرخە بێت کە لە Vercel دادەنێیت

    window.generateRawLink = async function() {
      const id = document.getElementById('updateId').value.trim();
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');
      
      if (!id) {
        statusDiv.textContent = '❌ تکایە ناسنامە بنووسە';
        return;
      }

      const config = {
        title: document.getElementById('title').value,
        message: document.getElementById('message').value,
        update_url: document.getElementById('updateUrl').value,
        latest_version: document.getElementById('latestVersion').value,
        update_button_text: document.getElementById('updateButtonText').value,
        cancel_button_text: "Cancel",
        force_update: false
      };

      statusDiv.textContent = '⏳ چاوەڕێ بکە...';
      
      try {
        const response = await fetch('/api/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_SECRET}`
          },
          body: JSON.stringify({ id, config })
        });

        const data = await response.json();
        
        if (response.ok) {
          statusDiv.textContent = '✅ لینکی Raw بە سەرکەوتوویی دروست بوو!';
          statusDiv.style.color = '#34C759';
          document.getElementById('rawLinkDisplay').textContent = data.rawUrl;
          resultDiv.style.display = 'block';
        } else {
          statusDiv.textContent = '❌ هەڵە: ' + (data.error || response.status);
          statusDiv.style.color = '#FF3B30';
        }
      } catch (error) {
        statusDiv.textContent = '❌ هەڵەی تۆڕ: ' + error.message;
        statusDiv.style.color = '#FF3B30';
      }
    };

    window.copyRawLink = function() {
      const link = document.getElementById('rawLinkDisplay').textContent;
      navigator.clipboard.writeText(link).then(() => {
        alert('✅ لینک کۆپی کرا!');
      });
    };
  </script>
</body>
</html>
